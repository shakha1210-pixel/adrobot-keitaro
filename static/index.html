<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Chrome: sahifani avto-tarjima qilib DOM'ni buzmasligi uchun -->
  <meta name="google" content="notranslate">
  <!-- HTML ham keshlanmasin (asset'lar serverdan no-cache bilan keladi) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Adrobot</title>
  <meta name="description" content="Adrobot — Keitaro campaign management dashboard.">
  <meta name="theme-color" content="#0A0B0D">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
  <link rel="stylesheet" href="premium.css?v=6">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="crt-overlay" aria-hidden="true"></div>

  <div id="boot" class="boot" role="status" aria-live="polite" aria-label="Adrobot system startup">
    <div class="boot-shell">
      <div class="boot-topline">
        <span class="boot-wordmark">ADROBOT <i>///</i> BOOT</span>
        <span class="boot-unit">SYS&nbsp;01</span>
      </div>
      <canvas id="bootMark" class="boot-mark" width="16" height="16" aria-hidden="true"></canvas>
      <div class="boot-lockup">
        <strong>ADROBOT</strong>
        <span>CAMPAIGN CONTROL SYSTEM</span>
      </div>
      <div id="bootCount" class="boot-count" aria-label="Loading progress">000</div>
      <div id="bootBar" class="boot-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <div id="bootLog" class="boot-log" aria-live="off"></div>
      <div class="boot-foot">
        <span class="boot-state"><i></i> SYSTEM INITIALIZING</span>
        <kbd>PRESS ANY KEY TO SKIP</kbd>
      </div>
    </div>
  </div>

  <header class="app-header">
    <div class="header-top">
      <a class="brand" href="#" aria-label="Adrobot">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="34" height="34">
            <defs>
              <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2a2f3a"/>
                <stop offset="1" stop-color="#14171d"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#logoG)" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5"/>
            <path d="M22 47 L32 19 L42 47 M26.5 36.5 H37.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">Adrobot<small>Keitaro Admin</small></span>
      </a>
      <div class="header-side">
        <div class="lang-switch" role="group" data-i18n-aria="lang.switch">
          <button type="button" class="lang-btn" data-lang="ru" aria-pressed="true">RU</button>
          <button type="button" class="lang-btn" data-lang="uz" aria-pressed="false">UZ</button>
        </div>
        <div id="healthBadge" class="health health--loading" role="status">
          <span class="health-dot" aria-hidden="true"></span>
          <span class="health-label" data-i18n="health.checking"></span>
        </div>
      </div>
    </div>
    <nav class="tabs" role="tablist" data-i18n-aria="aria.tabs">
      <button type="button" class="tab is-active" id="tab-btn-create" role="tab" aria-selected="true" aria-controls="tab-create" data-tab="create" data-i18n="tab.create"></button>
      <button type="button" class="tab" id="tab-btn-editor" role="tab" aria-selected="false" aria-controls="tab-editor" data-tab="editor" data-i18n="tab.editor"></button>
      <button type="button" class="tab" id="tab-btn-history" role="tab" aria-selected="false" aria-controls="tab-history" data-tab="history" data-i18n="tab.history"></button>
    <span class="tab-ink" aria-hidden="true"></span>
    </nav>
  </header>

  <main class="app-main">
    <div id="metaBanner" class="banner banner--error" hidden role="alert"></div>

    <!-- Tab 1: create campaign -->
    <section id="tab-create" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-create">
      <div class="page-head">
        <h1 data-i18n="tab.create"></h1>
        <p class="page-sub" data-i18n="page.create.sub"></p>
      </div>

      <div id="creatorFormWrap">
        <form id="creatorForm" class="card form-card" novalidate>
          <div class="form-grid">
            <div class="field">
              <label class="field-label" for="nameInput" data-i18n="form.name.label"></label>
              <input id="nameInput" class="input input--mono" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="form.name.ph" disabled aria-describedby="nameHint">
              <p class="field-hint" id="nameHint" data-i18n="form.name.hint.loading"></p>
            </div>

            <div class="field">
              <label class="field-label" for="geoInput" data-i18n="form.geo.label"></label>
              <div class="combobox" id="geoCombo">
                <input id="geoInput" class="input input--mono" type="text" maxlength="2" autocomplete="off" spellcheck="false" placeholder="UZ" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="geoList" aria-describedby="geoHint">
                <button type="button" class="cb-caret" tabindex="-1" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div id="geoList" class="cb-list" role="listbox" data-i18n-aria="aria.geo_list" hidden></div>
              </div>
              <p class="field-hint" id="geoHint" data-i18n="form.geo.hint"></p>
            </div>

            <div class="field field--wide">
              <label class="field-label" for="offerInput" data-i18n="form.offer.label"></label>
              <div class="combobox" id="offerCombo">
                <input id="offerInput" class="input" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="form.offer.ph" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="offerList" aria-describedby="offerHint">
                <button type="button" class="cb-caret" tabindex="-1" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div id="offerList" class="cb-list" role="listbox" data-i18n-aria="aria.offer_list" hidden></div>
              </div>
              <input type="hidden" id="offerIdInput">
              <div id="offerSelected" class="selected-chip" hidden></div>
              <p class="field-hint" id="offerHint" data-i18n="form.offer.hint"></p>
            </div>
          </div>

          <div id="formError" class="form-error" hidden role="alert"></div>

          <div class="form-actions">
            <button type="submit" id="createBtn" class="btn btn--primary" disabled data-i18n="form.submit"></button>
          </div>
        </form>
      </div>

      <div id="createSuccess" hidden></div>
    </section>

    <!-- Tab 2: campaign editor -->
    <section id="tab-editor" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-editor" hidden>
      <div class="page-head">
        <h1 data-i18n="tab.editor"></h1>
        <p class="page-sub" data-i18n="page.editor.sub"></p>
      </div>

      <div class="card picker-card">
        <div class="picker-row">
          <div class="combobox picker-combo" id="campaignCombo">
            <input id="campaignInput" class="input" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="editor.picker.ph" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="campaignList">
            <button type="button" class="cb-caret" tabindex="-1" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="campaignList" class="cb-list" role="listbox" data-i18n-aria="aria.campaign_list" hidden></div>
          </div>
          <button type="button" class="icon-btn" id="campaignRefreshBtn" data-combo-keep data-i18n-aria="btn.refresh_picker" data-i18n-title="btn.refresh_picker">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <label class="toggle">
            <input type="checkbox" id="showAllToggle">
            <span class="toggle-ui" aria-hidden="true"></span>
            <span class="toggle-label" data-i18n="editor.show_all"></span>
          </label>
        </div>
      </div>

      <div id="editorContent"></div>
    </section>

    <!-- Tab 3: operations history -->
    <section id="tab-history" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-history" hidden>
      <div class="page-head page-head--row">
        <div>
          <h1 data-i18n="tab.history"></h1>
          <p class="page-sub" data-i18n="page.history.sub"></p>
        </div>
        <div class="head-actions">
          <button id="autoRefreshBtn" class="btn btn--ghost btn--sm" type="button"><span class="auto-dot" aria-hidden="true"></span></button>
          <button id="refreshHistoryBtn" class="btn btn--ghost btn--sm" type="button" data-i18n="history.refresh"></button>
        </div>
      </div>

      <div class="card table-card" id="historyWrap">
        <div class="table-scroll">
          <table class="table ops-table">
            <thead>
              <tr><th data-i18n="history.th.time"></th><th data-i18n="history.th.action"></th><th data-i18n="history.th.campaign"></th><th data-i18n="history.th.status"></th></tr>
            </thead>
            <tbody>
              <tr><td><div class="skel skel--w90"></div></td><td><div class="skel skel--w60"></div></td><td><div class="skel skel--w80"></div></td><td><div class="skel skel--w40"></div></td></tr>
              <tr><td><div class="skel skel--w90"></div></td><td><div class="skel skel--w60"></div></td><td><div class="skel skel--w80"></div></td><td><div class="skel skel--w40"></div></td></tr>
              <tr><td><div class="skel skel--w90"></div></td><td><div class="skel skel--w60"></div></td><td><div class="skel skel--w80"></div></td><td><div class="skel skel--w40"></div></td></tr>
              <tr><td><div class="skel skel--w90"></div></td><td><div class="skel skel--w60"></div></td><td><div class="skel skel--w80"></div></td><td><div class="skel skel--w40"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <footer class="app-footer" id="appFooter" hidden></footer>
  </main>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="modalRoot" class="modal-root" hidden></div>

  <noscript>
    <div class="noscript">JavaScript is required to run Adrobot.</div>
  </noscript>

  <script src="fx.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
